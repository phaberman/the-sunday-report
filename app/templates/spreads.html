{% extends "base.html" %}
{% block body %}
<div class="app-page">
{% include "partials/spreads_panel.html" %}

{% if toast %}
<div class="toast" id="toast" role="status">{{ toast }}</div>
<script>
(function () {
  var el = document.getElementById("toast");
  if (!el) return;
  function hide() {
    if (el.classList.contains("hide")) return;
    el.classList.add("hide");
    setTimeout(function () { el.remove(); }, 200);
  }
  el.addEventListener("click", hide);
  setTimeout(hide, 5000);
})();
</script>
{% endif %}
{% endblock %}
