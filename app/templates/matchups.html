{% extends "base.html" %}
{% block body %}
<div class="app-page">
<p class="muted">{{ season }} · Week {{ week }}</p>
{% if flash %}<p class="flash">{{ flash }}</p>{% endif %}
{% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}

<div class="toolbar matchups-toolbar">
  <div class="chip-row matchups-weeks" role="radiogroup" aria-label="Week">
    {% for s, w in week_list %}
    <label class="chip{% if (s, w) in past_weeks %} chip-past{% endif %}">
      <input type="radio" name="week" value="{{ w }}"
        {% if w == week %}checked{% endif %}
        hx-get="/matchups"
        hx-target="#board"
        hx-swap="outerHTML">
      <span>{{ w }}</span>
    </label>
    {% endfor %}
  </div>
  <div class="btn-row matchups-actions matchups-actions-icons">
    <form method="post" action="/matchups/refresh">
      <input type="hidden" name="week" value="{{ week }}">
      <button type="submit" class="btn btn-sm btn-icon" aria-label="Refresh schedule and scores" title="Refresh schedule and scores">
        <svg class="btn-icon-svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a5.99 5.99 0 0 1-5.65 4c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.68 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </form>
    <a class="btn btn-ghost btn-sm btn-icon" href="/matchups/export?week={{ week }}" aria-label="Export week to Excel" title="Export week to Excel">
      <svg class="btn-icon-svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/>
      </svg>
    </a>
  </div>
</div>

{% include "partials/matchups_board.html" %}
</div>
{% endblock %}
