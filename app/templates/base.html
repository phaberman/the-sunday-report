<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Sunday Report</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>The Sunday Report</h1>
      {% if request.session.get("user") %}
      <form class="logout-form" method="post" action="/logout"><button type="submit">Log out</button></form>
      {% endif %}
      <nav class="tabs tabs-4">
        <a href="/scoreboard" {% if nav == "scoreboard" %}class="active"{% endif %}>Scoreboard</a>
        <a href="/matchups" {% if nav == "matchups" %}class="active"{% endif %}>Matchups</a>
        <a href="/spreads" {% if nav == "spreads" %}class="active"{% endif %}>Spreads</a>
        <a href="/upload" {% if nav == "upload" %}class="active"{% endif %}>Upload</a>
      </nav>
    </div>
  </header>
  <div class="wrap main">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
