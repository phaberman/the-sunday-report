{% extends "base.html" %}
{% block body %}
<p class="muted">{{ season }} · Week {{ week }}</p>
{% if flash %}<p class="flash">{{ flash }}</p>{% endif %}
{% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
<div class="toolbar">
  <form method="post" action="/refresh">
    <button class="btn-primary" type="submit">Get latest spreads</button>
  </form>
  <a class="btn btn-ghost" href="/export">Export Excel</a>
  <form method="post" action="/email" onsubmit="return confirm({{ ('Send week %s spreads to %s?' % (week, email_to or 'EMAIL_TO')) | tojson }})">
    <button class="btn-ghost" type="submit">Email</button>
  </form>
</div>
{% include "partials/spread_table.html" %}
{% endblock %}
