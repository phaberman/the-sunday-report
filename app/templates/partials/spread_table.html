<div class="table-card" id="table">
  <table>
    <thead>
      <tr><th>Index</th><th>Kickoff</th><th>Matchup</th><th>Away Team</th><th>Home Team</th><th>Spread</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td class="mono">{{ r.index }}</td>
        <td class="mono">{{ r.kickoff }}</td>
        <td>{{ r.game }}</td>
        <td>{{ r.away_team }}</td>
        <td>{{ r.home_team }}</td>
        <td class="spread">{% if r.vegas_hint %}<span class="tip">{{ r.vegas_hint }}</span>{% endif %}{{ r.vegas }}</td>
      </tr>
      {% else %}
      <tr><td colspan="6">{{ empty|default("No games this week.") }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
