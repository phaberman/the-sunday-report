<div id="board">
  <div class="table-card">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Home Team</th>
        <th>Away Team</th>
        <th>Spread</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td class="mono">{{ r.date or "—" }}</td>
        <td>{{ r.home_team }}</td>
        <td>{{ r.away_team }}</td>
        <td class="spread">{% if r.vegas_hint %}<span class="tip">{{ r.vegas_hint }}</span>{% endif %}{{ r.vegas or "—" }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">No matchups for this week.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
</div>
