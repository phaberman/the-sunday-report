<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Sunday Report</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>The Sunday Report</h1>
      <nav class="tabs">
        <a href="/" {% if nav == "now" %}class="active"{% endif %}>This week</a>
        <a href="/past" {% if nav == "past" %}class="active"{% endif %}>Past</a>
      </nav>
    </div>
  </header>
  <div class="wrap main">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
