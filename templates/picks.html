{% extends "base.html" %}
{% block body %}
<p class="muted">{{ season }} · Week {{ week }}</p>
<form class="form" style="margin-bottom:16px">
  <label>Week
    <select name="week" hx-get="/" hx-target="#table" hx-select="#table" hx-swap="outerHTML">
      {% for s, w in week_list %}
      <option value="{{ w }}" {% if w == week %}selected{% endif %}>{{ s }} · {{ w }}</option>
      {% endfor %}
    </select>
  </label>
</form>
<div id="table">
  <table>
    <thead>
      <tr><th>Game</th><th>Model</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.game }}</td>
        <td>{{ r.model }}</td>
      </tr>
      {% else %}
      <tr><td colspan="2">No picks yet. Upload a CSV.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
